[project]
name = "loomcore"
version = "0.0.0"
description = "A small Python agent harness: the loop, tools, sandbox, context, guardrails and an append-only event log around a model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
authors = [{ name = "Kang'alia Nyamu", email = "17615243+kangaliaisaac@users.noreply.github.com" }]
dependencies = ["pydantic>=2.11"]

[dependency-groups]
dev = ["hypothesis", "mypy", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loomcore"]

[tool.ruff]
line-length = 88
target-version = "py315"
# Markdown holds illustrative design snippets (spec.md), not code to format.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # import order
  "N",             # naming
  "UP",            # modern syntax
  "B",             # likely bugs
  "A",             # shadowed builtins
  "C4",            # comprehensions
  "SIM",           # simplifications
  "RET",           # return hygiene
  "PTH",           # pathlib over os.path
  "C90",           # complexity
  "PL",            # pylint size and design rules
  "ANN",           # type annotations
  "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-returns = 4
max-statements = 30

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]   # tests may use bare literals; annotations stay (mypy is strict)

[tool.mypy]
strict = true
python_version = "3.15"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
